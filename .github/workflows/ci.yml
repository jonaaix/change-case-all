name: CI

on:
   push:
      branches: [master]
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

jobs:
   build:
      runs-on: ubuntu-latest
      strategy:
         matrix:
            node-version: [22, 24]
      steps:
         - uses: actions/checkout@v7

         - name: Setup Node.js
           uses: actions/setup-node@v7
           with:
              node-version: ${{ matrix.node-version }}
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Build with Vite
           run: npm run build

         - name: Test with Vitest
           run: npm run test
